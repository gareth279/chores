name: Validate

on:
  push:
  pull_request:

jobs:
  php-and-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: intl, mysqli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check PHP syntax
        run: find . -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run source-level regression checks
        run: python -m unittest discover -s tests -v
